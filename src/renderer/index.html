<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面钓鱼</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>☁️ 桌面钓鱼</strong><span>专注工作，潜入深海。休息片刻，收获惊喜。</span></header>
<main><div class="scene"><div class="sky"><div class="sun"></div><div class="island">🏝️</div><div class="dock">🪵　🎣　🐈</div></div><div class="sea"><div class="waves">﹏　﹏　﹏　﹏　﹏</div><div class="fishart">🐟　🐠　🐡</div><div class="deep">🪸　　　🐚　　　🌿</div><div class="depth" id="depth">0.0 m</div></div></div>
<aside><h2>今日的海</h2><p id="status">准备放钩</p><p>有效专注：<b id="time">0 分 0 秒</b></p><button id="cast">放钩</button><button id="reel" disabled>收杆</button><div id="catch" class="catch">放钩后切换到其他工作窗口，回来收杆。</div><nav><button id="book">图鉴</button><button id="tank">鱼缸</button></nav><section id="panel" class="panel" hidden></section></aside></main>
<footer>V2.6 风格占位预览 · 正式美术资源尚未接入 · 仅 Windows 支持有效专注计时</footer><script src="renderer.js"></script></body></html>
