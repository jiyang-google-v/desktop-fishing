name: Godot Windows Build
on:
  push:
    branches: [main, 'refactor/godot-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true
      - name: Import and verify Godot project
        shell: pwsh
        run: ./scripts/ci_verify.ps1
      - name: Test Windows focus helper
        shell: powershell
        run: ./tests/windows_focus_smoke.ps1
      - name: Export Windows executable
        shell: pwsh
        run: ./scripts/ci_verify.ps1 -ExportOnly
      - name: Smoke-test exported game
        shell: pwsh
        run: |
          $process = Start-Process -FilePath build/windows/DesktopFishing.exe -ArgumentList '--headless','--quit-after','10','--','--tests','--export-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Exported game failed to launch' }
      - name: Verify exported native desktop transparency
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'build/windows/transparency.log'
          $stdoutPath = Join-Path $PWD 'build/windows/transparency-stdout.log'
          $stderrPath = Join-Path $PWD 'build/windows/transparency-stderr.log'
          $process = Start-Process -FilePath build/windows/DesktopFishing.exe -ArgumentList '--audio-driver','Dummy','--log-file',$logPath,'--quit-after','600','--','--tests','--transparency-smoke' -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          Get-Content $logPath,$stdoutPath,$stderrPath -ErrorAction SilentlyContinue
          Write-Host "Native transparency process exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw 'Native desktop transparency check failed' }
      - name: Verify physical exported toolbar mode buttons
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD 'build/windows/toolbar-click.log'
          $stdoutPath = Join-Path $PWD 'build/windows/toolbar-click-stdout.log'
          $stderrPath = Join-Path $PWD 'build/windows/toolbar-click-stderr.log'
          $process = Start-Process -FilePath build/windows/DesktopFishing.exe -ArgumentList '--audio-driver','Dummy','--log-file',$logPath,'--quit-after','1800','--','--tests','--toolbar-click-smoke' -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          Get-Content $logPath,$stdoutPath,$stderrPath -ErrorAction SilentlyContinue
          $nativeOutput = (Get-Content $logPath,$stdoutPath,$stderrPath -Raw -ErrorAction SilentlyContinue) -join [Environment]::NewLine
          if ($process.ExitCode -ne 0 -or $nativeOutput -match '(SCRIPT ERROR:|(?m)^ERROR:)') { throw 'Physical toolbar mode switch failed or native engine errors were logged' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-fishing-godot-windows
          path: build/windows/**
          if-no-files-found: error

      - name: Upload transparency failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transparency-diagnostics
          path: |
            build/windows/*transparency*.log
            build/windows/*toolbar-click*.log
            build/windows/transparency-qa/**
          if-no-files-found: ignore
